<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[DRAFT] Azure Databricks Claude 모델 운영 가이드</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px;
  line-height: 1.7;
}
.layout { display: flex; max-width: 1280px; margin: 0 auto; }
/* Sidebar */
aside {
  width: 280px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 28px 20px;
  border-right: 1px solid var(--cp-border);
  background: var(--cp-bg-elevated);
}
aside .brand { font-weight: 700; font-size: 15px; color: var(--cp-accent); margin-bottom: 4px; }
aside .sub { font-size: 12px; color: var(--cp-text-soft); margin-bottom: 20px; }
aside nav a {
  display: block;
  padding: 6px 10px;
  margin: 2px 0;
  border-radius: 8px;
  color: var(--cp-text-muted);
  text-decoration: none;
  font-size: 13.5px;
}
aside nav a:hover { background: var(--cp-accent-soft); color: var(--cp-accent); }
aside nav a.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--cp-text-soft); margin-top: 16px; pointer-events: none; }
/* Main */
main { flex: 1; min-width: 0; padding: 48px 56px 120px; }
.hero {
  background: var(--cp-surface);
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  padding: 32px 36px;
  margin-bottom: 40px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.hero h1 { margin: 0 0 16px; font-size: 30px; line-height: 1.25; }
.hero .meta { font-size: 14px; color: var(--cp-text-muted); border-left: 3px solid var(--cp-accent); padding-left: 14px; margin: 8px 0; }
.draft { display: inline-block; margin-top: 14px; background: var(--cp-accent-soft); color: var(--cp-accent); border: 1px solid var(--cp-accent); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
section { margin-bottom: 52px; scroll-margin-top: 20px; }
h2 { font-size: 24px; margin: 0 0 4px; padding-bottom: 10px; border-bottom: 2px solid var(--cp-border); }
h3 { font-size: 18px; margin: 28px 0 8px; color: var(--cp-text); }
h4 { font-size: 15px; margin: 20px 0 6px; color: var(--cp-accent); }
p { margin: 10px 0; }
a { color: var(--cp-link); }
ul, ol { margin: 10px 0; padding-left: 22px; }
li { margin: 4px 0; }
strong { color: var(--cp-text); }
code {
  font-family: Consolas, "Courier New", Courier, monospace;
  background: var(--cp-surface-soft);
  border: 1px solid var(--cp-border);
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 13.5px;
}
pre {
  background: var(--cp-surface-soft);
  border: 1px solid var(--cp-border);
  border-radius: 10px;
  padding: 16px 18px;
  overflow-x: auto;
  margin: 14px 0;
}
pre code { background: none; border: none; padding: 0; font-size: 13.5px; line-height: 1.6; color: var(--cp-text); }
table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
th, td { border: 1px solid var(--cp-border); padding: 9px 12px; text-align: left; vertical-align: top; }
th { background: var(--cp-surface-soft); font-weight: 600; }
tr:nth-child(even) td { background: var(--cp-accent-soft); }
/* Callouts */
.callout { border-radius: 10px; padding: 14px 18px; margin: 16px 0; border: 1px solid var(--cp-border); background: var(--cp-surface); }
.callout p:first-child { margin-top: 0; }
.callout p:last-child { margin-bottom: 0; }
.callout.warn { border-left: 4px solid var(--cp-warning); }
.callout.warn .tag { color: var(--cp-warning); }
.callout.check { border-left: 4px solid var(--cp-success); background: var(--cp-bg-elevated); }
.callout.check .tag { color: var(--cp-success); }
.callout.info { border-left: 4px solid var(--cp-link); }
.callout.info .tag { color: var(--cp-link); }
.callout .tag { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; }
.mermaid { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 12px; padding: 20px; margin: 18px 0; text-align: center; }
.ts-item { border: 1px solid var(--cp-border); border-radius: 10px; padding: 14px 18px; margin: 12px 0; background: var(--cp-surface); }
.ts-item h4 { margin-top: 0; }
.chk { list-style: none; padding-left: 0; }
.chk li { padding-left: 26px; position: relative; }
.chk li::before { content: "☐"; position: absolute; left: 0; color: var(--cp-accent); font-size: 15px; }
.topbtn { position: fixed; bottom: 24px; right: 24px; background: var(--cp-accent); color: var(--cp-accent-fg); border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 20px; cursor: pointer; box-shadow: var(--cp-shadow); }
.draft-banner { position: sticky; top: 0; z-index: 50; background: var(--cp-accent); color: var(--cp-accent-fg); text-align: center; font-size: 13.5px; font-weight: 600; padding: 7px 16px; letter-spacing: .02em; }
@media (max-width: 900px) {
  aside { display: none; }
  main { padding: 24px 18px 80px; }
}
</style>

<style>
main .doc h1 { font-size: 30px; line-height: 1.3; margin: 0 0 20px; padding-bottom: 12px; border-bottom: 2px solid var(--cp-border); }
main .doc blockquote {
  margin: 16px 0; padding: 14px 18px; border-radius: 10px;
  border: 1px solid var(--cp-border); border-left: 4px solid var(--cp-warning);
  background: var(--cp-surface);
}
main .doc blockquote p:first-child { margin-top: 0; }
main .doc blockquote p:last-child { margin-bottom: 0; }
main .doc blockquote blockquote { border-left-color: var(--cp-border-strong); background: var(--cp-surface-soft); }
main .doc img { display: block; max-width: 100%; height: auto; margin: 16px 0 24px; border: 1px solid var(--cp-border); }
aside nav a.active { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 600; }
.docfoot { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--cp-border); font-size: 13px; color: var(--cp-text-soft); display: flex; gap: 16px; flex-wrap: wrap; }
.docfoot a { text-decoration: none; }
.loading { color: var(--cp-text-soft); font-size: 14px; }
</style>
</head>
<body>
<div class="draft-banner">⚠️ DRAFT — 리뷰용 초안 문서입니다. 조직 표준 확정 전까지 그대로 적용하지 마세요.</div>
<div class="layout">
<aside>
  <div class="brand">Azure Databricks · Claude 운영</div>
  <div class="sub">실무 중심 배포·모니터링 가이드</div>
  <nav id="nav"></nav>
</aside>
<main>
  <div id="doc" class="doc"><p class="loading">문서를 불러오는 중…</p></div>
  <div class="docfoot">
    <a id="edit-link" href="#" target="_blank" rel="noopener">✏️ GitHub에서 편집</a>
    <a id="view-link" href="#" target="_blank" rel="noopener">📄 원본 마크다운 보기</a>
    <a href="https://github.com/yunkyoungaum/ADB_guide" target="_blank" rel="noopener">⭐ 리포지토리</a>
  </div>
</main>
</div>
<button class="topbtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
const REPO = "yunkyoungaum/ADB_guide";
const BRANCH = "main";
const SRC = "source/";
const dark = document.documentElement.getAttribute("data-theme") === "dark";
if (window.mermaid) {
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "loose" });
}

const SECTION_LABELS = {
  "guides/01-workspace-deployment/README.md": "배포",
  "guides/03-calling-claude/README.md": "호출 · 모니터링",
  "appendix/inference-tables.md": "부록"
};

let pages = [];

function renderMarkdown(md) {
  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = (code, lang) => {
    const text = typeof code === "object" ? code.text : code;
    const language = typeof code === "object" ? code.lang : lang;
    if (language === "mermaid") {
      return '<div class="mermaid">' + text + "</div>";
    }
    return origCode(typeof code === "object" ? code : text, lang);
  };
  return marked.parse(md, { renderer, gfm: true, breaks: false });
}

function rewriteLinks(container, currentPath) {
  const baseDir = currentPath.slice(0, currentPath.lastIndexOf("/") + 1);
  container.querySelectorAll("img[src]").forEach(img => {
    const src = img.getAttribute("src");
    if (!/^(https?:|data:|\/)/.test(src)) {
      const resolved = new URL(src, "https://x/" + baseDir).pathname.slice(1);
      img.setAttribute("src", SRC + resolved);
    }
  });
  container.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (/^(https?:|mailto:|#)/.test(href)) {
      if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
      return;
    }
    const resolved = new URL(href, "https://x/" + baseDir).pathname.slice(1);
    if (resolved.endsWith(".md")) a.setAttribute("href", "#/" + resolved);
  });
}

async function loadPage(path) {
  const doc = document.getElementById("doc");
  doc.innerHTML = '<p class="loading">문서를 불러오는 중…</p>';
  try {
    const res = await fetch(SRC + path + "?t=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    doc.innerHTML = renderMarkdown(await res.text());
  } catch (e) {
    doc.innerHTML = "<h1>문서를 불러오지 못했습니다</h1><p><code>" + SRC + path + "</code></p>";
  }
  rewriteLinks(doc, path);
  if (window.mermaid) {
    try { await mermaid.run({ nodes: doc.querySelectorAll(".mermaid") }); } catch (e) {}
  }
  document.getElementById("edit-link").href =
    "https://github.com/" + REPO + "/edit/" + BRANCH + "/" + SRC + path;
  document.getElementById("view-link").href =
    "https://github.com/" + REPO + "/blob/" + BRANCH + "/" + SRC + path;
  document.querySelectorAll("#nav a[data-path]").forEach(a => {
    a.classList.toggle("active", a.dataset.path === path);
  });
  window.scrollTo({ top: 0 });
}

function currentPath() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  return pages.some(p => p.path === h) ? h : (pages[0] && pages[0].path);
}

async function boot() {
  const nav = document.getElementById("nav");
  try {
    const summary = await (await fetch(SRC + "SUMMARY.md?t=" + Date.now())).text();
    pages = [...summary.matchAll(/\*\s*\[([^\]]+)\]\(([^)]+)\)/g)]
      .map(m => ({ title: m[1], path: m[2] }));
  } catch (e) {
    nav.innerHTML = "<p class='loading'>목차를 불러오지 못했습니다.</p>";
    return;
  }
  nav.innerHTML = pages.map(p => {
    const label = SECTION_LABELS[p.path]
      ? '<a class="section-label">' + SECTION_LABELS[p.path] + "</a>" : "";
    return label + '<a data-path="' + p.path + '" href="#/' + p.path + '">' + p.title + "</a>";
  }).join("");
  await loadPage(currentPath());
}

window.addEventListener("hashchange", () => loadPage(currentPath()));
boot();
</script>
</body>
</html>
